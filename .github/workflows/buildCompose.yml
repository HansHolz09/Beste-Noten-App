  wasm:
    if: ${{ inputs.build_wasm }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.temurin_version }}

      - uses: gradle/actions/setup-gradle@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}

      - name: Build WASM Distribution
        run: |
          set -e
          ./gradlew :${MODULE_PATH}:wasmJsBrowserDistribution

      - name: Smoke test WASM app
        if: ${{ inputs.run_smoke_tests }}
        run: |
          set -e

          npm install --no-save playwright serve

          DIST_DIR="${MODULE_PATH}/build/dist/wasmJs/productionExecutable"
          npx serve -l 8080 "$DIST_DIR" &
          SERVER_PID=$!

          sleep 3

          npx playwright install --with-deps chromium

          cat > smoke-test.mjs << 'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch();
          const page = await browser.newPage();

          const errors = [];

          page.on('pageerror', (err) => {
            errors.push(`Uncaught exception: ${err.message}`);
          });

          page.on('console', (msg) => {
            if (msg.type() === 'error') {
              errors.push(`Console error: ${msg.text()}`);
            }
          });

          page.on('requestfailed', (req) => {
            errors.push(`Request failed: ${req.url()} - ${req.failure()?.errorText}`);
          });

          await page.goto('http://localhost:8080', { waitUntil: 'load', timeout: 30000 });
          await page.waitForTimeout(10000);

          await browser.close();

          if (errors.length > 0) {
            console.error('Smoke test failed with the following errors:');
            for (const e of errors) {
              console.error(' - ' + e);
            }
            process.exit(1);
          }

          console.log('Smoke test passed. No errors detected after 10 seconds.');
          EOF

          node smoke-test.mjs
          EXIT_CODE=$?

          kill "$SERVER_PID" || true
          exit $EXIT_CODE

      - name: Upload WASM as normal artifact
        if: ${{ !inputs.upload_wasm_as_pages_artifact }}
        uses: actions/upload-artifact@v7
        continue-on-error: ${{ inputs.ignore_artifact_upload_errors }}
        with:
          name: wasm-dist
          path: ${{ env.MODULE_PATH }}/build/dist/wasmJs/productionExecutable

      - name: Upload Pages Artifact
        if: ${{ inputs.upload_wasm_as_pages_artifact }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.MODULE_PATH }}/build/dist/wasmJs/productionExecutable