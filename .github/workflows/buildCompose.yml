name: Build Compose Multiplatform

on:
  workflow_call:
    inputs:
      module_path:
        type: string
        default: composeApp
      jbr_version:
        type: string
        default: "25.0.2"
      jbr_build:
        type: string
        default: "b329.72"
      temurin_version:
        type: string
        default: "21"
      node_version:
        type: string
        default: "22"
      upload_wasm_as_pages_artifact:
        type: boolean
        default: false
      run_smoke_tests:
        type: boolean
        default: false
      ignore_artifact_upload_errors:
        type: boolean
        default: false

      build_android:
        type: boolean
        default: true
      build_ios:
        type: boolean
        default: true
      build_windows_x64:
        type: boolean
        default: true
      build_windows_arm64:
        type: boolean
        default: true
      build_macos_x64:
        type: boolean
        default: true
      build_macos_arm64:
        type: boolean
        default: true
      build_linux_x64:
        type: boolean
        default: true
      build_linux_arm64:
        type: boolean
        default: true
      build_wasm:
        type: boolean
        default: true

env:
  MODULE_PATH: ${{ inputs.module_path }}
  JBR_VERSION: ${{ inputs.jbr_version }}
  JBR_BUILD: ${{ inputs.jbr_build }}

jobs:
  android:
    if: ${{ inputs.build_android }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - name: Prepare Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$HOME/release.keystore"
            {
              echo "storeFile=$HOME/release.keystore"
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
            } > keystore.properties
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.temurin_version }}

      - uses: gradle/actions/setup-gradle@v6

      - name: Build universal APK
        run: |
          set -e
          ./gradlew :androidApp:packageReleaseUniversalApk || ./gradlew :androidApp:assembleRelease
          mkdir -p artifacts
          APK=$(find "androidApp/build" -type f -iname "*universal*.apk" | head -n1)
          if [ -z "$APK" ]; then APK=$(find "androidApp/build" -type f -iname "*release*.apk" | head -n1); fi
          cp "$APK" artifacts/android-universal.apk

      - name: Enable KVM
        if: ${{ inputs.run_smoke_tests }}
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        if: ${{ inputs.run_smoke_tests }}
        id: avd-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-v1-api36-google_apis-x86_64

      - name: Create AVD snapshot
        if: ${{ inputs.run_smoke_tests && steps.avd-cache.outputs.cache-hit != 'true' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          avd-name: smoke-test-avd
          force-avd-creation: false
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
          disable-animations: false
          script: |
            echo "Generated clean AVD snapshot for caching."

      - name: Create Android smoke test script
        if: ${{ inputs.run_smoke_tests }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/android-smoke-test.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          APK="artifacts/android-universal.apk"

          if [[ ! -f "$APK" ]]; then
            echo "APK not found: $APK"
            exit 1
          fi

          AAPT="$(command -v aapt || true)"

          if [[ -z "$AAPT" ]]; then
            AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          fi

          if [[ -z "$AAPT" || ! -x "$AAPT" ]]; then
            echo "Could not find aapt."
            find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name 'aapt*' || true
            exit 1
          fi

          PACKAGE="$(
            "$AAPT" dump badging "$APK" |
              awk -F"'" '/^package:/{print $2; exit}'
          )"

          ACTIVITY="$(
            "$AAPT" dump badging "$APK" |
              awk -F"'" '/^launchable-activity:/{print $2; exit}'
          )"

          if [[ -z "$PACKAGE" ]]; then
            echo "Could not determine package name."
            "$AAPT" dump badging "$APK"
            exit 1
          fi

          if [[ -z "$ACTIVITY" ]]; then
            echo "Could not determine launchable activity."
            "$AAPT" dump badging "$APK"
            exit 1
          fi

          echo "Installing package: $PACKAGE"
          echo "Launch activity: $ACTIVITY"

          adb install -r "$APK"

          adb logcat -c
          adb shell am force-stop "$PACKAGE"

          START_OUTPUT="$(
            adb shell am start -W -n "$PACKAGE/$ACTIVITY"
          )"

          echo "$START_OUTPUT"

          if echo "$START_OUTPUT" | grep -qE '^Error:|Exception'; then
            echo "Android activity could not be started."
            exit 1
          fi

          sleep 20

          PID="$(adb shell pidof "$PACKAGE" | tr -d '\r' || true)"

          if [[ -n "$PID" ]]; then
            echo "Smoke test passed."
            echo "App process $PID stayed alive for 20 seconds."
            exit 0
          fi

          echo "Smoke test failed."
          echo "App process was not found after 20 seconds."

          echo "Current activity state:"
          adb shell dumpsys activity activities |
            grep -A 10 -B 10 "$PACKAGE" || true

          echo "Recent crash logs:"
          adb logcat -d |
            grep -E "$PACKAGE|AndroidRuntime|FATAL EXCEPTION" |
            tail -n 300 || true

          exit 1
          EOF

          chmod +x "$RUNNER_TEMP/android-smoke-test.sh"

      - name: Smoke test Android app
        if: ${{ inputs.run_smoke_tests }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          avd-name: smoke-test-avd
          force-avd-creation: false
          emulator-options: >-
            -no-snapshot-save
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
          disable-animations: true
          script: bash "$RUNNER_TEMP/android-smoke-test.sh"

      - uses: actions/upload-artifact@v7
        continue-on-error: ${{ inputs.ignore_artifact_upload_errors }}
        with:
          name: android-universal-apk
          path: artifacts/android-universal.apk

  ios:
    if: ${{ inputs.build_ios }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.temurin_version }}

      - name: Cache Kotlin/Native Tooling
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Xcode Archive (Unsigned)
        run: |
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme "Release App" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "build/iosApp.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_IDENTITY=""

      - name: Create Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r "build/iosApp.xcarchive/Products/Applications/"*.app Payload/
          zip -v -r "ios-unsigned.ipa" Payload

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v7
        continue-on-error: ${{ inputs.ignore_artifact_upload_errors }}
        with:
          name: ios-unsigned-ipa
          path: ios-unsigned.ipa

  ios_simulator:
    if: ${{ inputs.build_ios && inputs.run_smoke_tests }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.temurin_version }}

      - name: Cache Kotlin/Native Tooling
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Boot iOS Simulator (in background)
        id: boot_sim
        run: |
          set -euo pipefail
          
          DEVICE_ID="$(
            xcrun simctl list devices available -j |
              python3 -c '
          import json
          import sys
          
          data = json.load(sys.stdin)
          
          preferred_names = [
              "iPhone 17",
              "iPhone 17 Pro",
              "iPhone 16",
              "iPhone 16 Pro",
          ]
          
          available = [
              device
              for devices in data.get("devices", {}).values()
              for device in devices
              if device.get("isAvailable")
              and device.get("deviceTypeIdentifier", "").startswith(
                  "com.apple.CoreSimulator.SimDeviceType.iPhone"
              )
          ]
          
          for name in preferred_names:
              for device in available:
                  if device.get("name") == name:
                      print(device["udid"])
                      sys.exit(0)
          
          if available:
              print(available[0]["udid"])
              sys.exit(0)
          
          sys.exit(1)
          '
          )"

          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone simulator found."
            xcrun simctl list devices available
            exit 1
          fi

          echo "Booting simulator in background: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Build for iOS Simulator
        run: |
          set -e
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme "Release App" \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch arm64 \
            -derivedDataPath build/simulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_IDENTITY=""

      - name: Smoke test iOS Simulator app
        shell: bash
        env:
          DEVICE_ID: ${{ steps.boot_sim.outputs.device_id }}
        run: |
          set -euo pipefail

          APP="$(
            find build/simulator/Build/Products \
              -type d \
              -path "*-iphonesimulator/*.app" \
              -print \
              -quit
          )"

          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "No simulator .app bundle found."
            find build/simulator/Build/Products -maxdepth 4 -print || true
            exit 1
          fi

          INFO_PLIST="$APP/Info.plist"

          if [ ! -f "$INFO_PLIST" ]; then
            echo "Info.plist not found in app bundle: $APP"
            find "$APP" -maxdepth 2 -print
            exit 1
          fi

          BUNDLE_ID="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$INFO_PLIST"
          )"

          EXECUTABLE="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleExecutable" \
              "$INFO_PLIST"
          )"

          if [ -z "$BUNDLE_ID" ]; then
            echo "Could not determine CFBundleIdentifier."
            plutil -p "$INFO_PLIST" || true
            exit 1
          fi

          if [ -z "${DEVICE_ID:-}" ]; then
            echo "No DEVICE_ID from boot step, falling back to lookup."
            DEVICE_ID="$(
              xcrun simctl list devices available -j |
                python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          available = [
              device
              for devices in data.get("devices", {}).values()
              for device in devices
              if device.get("isAvailable")
              and device.get("deviceTypeIdentifier", "").startswith(
                  "com.apple.CoreSimulator.SimDeviceType.iPhone"
              )
          ]

          if available:
              print(available[0]["udid"])
              sys.exit(0)

          sys.exit(1)
          '
            )"
          fi

          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone simulator found."
            xcrun simctl list devices available
            exit 1
          fi

          echo "Found app bundle: $APP"
          echo "Bundle identifier: $BUNDLE_ID"
          echo "Executable: $EXECUTABLE"
          echo "Using simulator: $DEVICE_ID"
          
          cleanup() {
            echo "Shutting down simulator."
            xcrun simctl terminate "$DEVICE_ID" "$BUNDLE_ID" 2>/dev/null || true
            xcrun simctl shutdown "$DEVICE_ID" 2>/dev/null || true
          }

          trap cleanup EXIT

          echo "Waiting for simulator boot to complete: $DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b

          echo "Installing app."
          xcrun simctl uninstall "$DEVICE_ID" "$BUNDLE_ID" 2>/dev/null || true
          xcrun simctl install "$DEVICE_ID" "$APP"

          echo "Launching $BUNDLE_ID"

          LAUNCH_OUTPUT="$(
            xcrun simctl launch \
              --terminate-running-process \
              "$DEVICE_ID" \
              "$BUNDLE_ID"
          )"

          echo "$LAUNCH_OUTPUT"

          INITIAL_PID="$(
            printf '%s\n' "$LAUNCH_OUTPUT" |
              awk -F': ' 'NF == 2 { print $2; exit }'
          )"

          if ! [[ "$INITIAL_PID" =~ ^[0-9]+$ ]]; then
            echo "Could not determine application PID."
            exit 1
          fi

          echo "Application launched with PID $INITIAL_PID."

          sleep 10

          if kill -0 "$INITIAL_PID" 2>/dev/null; then
            echo "Smoke test passed."
            echo "App stayed alive with PID $INITIAL_PID for 10 seconds."
          else
            echo "App process $INITIAL_PID is no longer running."

            echo "Recent app logs:"
            xcrun simctl spawn "$DEVICE_ID" log show \
              --style compact \
              --last 2m \
              --predicate "process == \"$EXECUTABLE\" OR eventMessage CONTAINS[c] \"$BUNDLE_ID\"" \
              | tail -n 300 || true

            exit 1
          fi

  windows-x64:
    if: ${{ inputs.build_windows_x64 }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup JetBrains Runtime (JBRSDK)
        shell: bash
        run: |
          set -e
          BASE="https://cache-redirector.jetbrains.com/intellij-jbr"
          FILE="jbrsdk-${JBR_VERSION}-windows-x64-${JBR_BUILD}.tar.gz"
          curl -fsSL "$BASE/$FILE" -o "$RUNNER_TEMP/jbr.tar.gz"
          mkdir -p "$RUNNER_TEMP/jbr"
          TARBALL="$(cygpath -u "$RUNNER_TEMP/jbr.tar.gz")"
          DEST="$(cygpath -u "$RUNNER_TEMP/jbr")"
          tar -xzf "$TARBALL" -C "$DEST" --strip-components=1
          echo "JAVA_HOME=$RUNNER_TEMP/jbr" >> $GITHUB_ENV
          echo "$RUNNER_TEMP/jbr/bin" >> $GITHUB_PATH
          java -version

      - uses: gradle/actions/setup-gradle@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}

      - name: Build EXE (x64)
        shell: bash
        run: |
          set -e
          ./gradlew :${MODULE_PATH}:packageReleaseNsis
          mkdir -p artifacts
          EXE=$(find "${MODULE_PATH}/build/compose/binaries/main-release/nsis" -type f -name "*.exe" | head -n1)
          cp "$EXE" artifacts/windows-x64.exe

      - name: Smoke test Windows app
        if: ${{ inputs.run_smoke_tests }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installer = Get-ChildItem -Path "artifacts" -Filter "*.exe" -File | Select-Object -First 1
          if (-not $installer) {
            throw "No Windows installer found."
          }

          $installDir = Join-Path $env:RUNNER_TEMP "smoke-install"
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null

          function Find-AppExecutable {
            param(
              [Parameter(Mandatory = $true)]
              [string] $Root
            )

            if (-not (Test-Path $Root)) {
              return $null
            }

            $candidates = Get-ChildItem -Path $Root -Recurse -Filter "*.exe" -File -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Name -notmatch "unins|uninstall|setup|installer|update|elevate|java|javaw|keytool|jpackage|jlink" -and
                $_.FullName -notmatch "\\resources\\|\\runtime\\|\\jre\\|\\jdk\\|\\bin\\"
              } |
              Sort-Object `
                @{ Expression = { if ($_.DirectoryName -eq $Root) { 0 } else { 1 } }; Ascending = $true },
                @{ Expression = { $_.DirectoryName.Split([IO.Path]::DirectorySeparatorChar).Count }; Ascending = $true },
                @{ Expression = { $_.Length }; Ascending = $false }

            $candidate = $candidates | Select-Object -First 1

            if ($candidate) {
              return $candidate.FullName
            }

            return $null
          }

          Write-Host "Installing $($installer.FullName) into $installDir"

          $installerProcess = Start-Process `
            -FilePath $installer.FullName `
            -ArgumentList @("/S", "/D=$installDir") `
            -Wait `
            -PassThru

          if ($installerProcess.ExitCode -ne 0) {
            throw "Installer exited with code $($installerProcess.ExitCode)."
          }

          $app = Find-AppExecutable -Root $installDir

          if (-not $app) {
            Write-Host "Installed files:"
            Get-ChildItem -Path $installDir -Recurse -ErrorAction SilentlyContinue |
              Select-Object FullName |
              Out-String -Width 240 |
              Write-Host

            throw "Installed app executable not found."
          }

          Write-Host "Launching $app"

          $process = Start-Process `
            -FilePath $app `
            -WorkingDirectory (Split-Path -Parent $app) `
            -PassThru

          Start-Sleep -Seconds 20

          $watchedProcess = Get-Process -Id $process.Id -ErrorAction SilentlyContinue
          if (-not $watchedProcess) {
            throw "App process exited during startup smoke test."
          }

          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          Write-Host "Smoke test passed. App stayed alive for 20 seconds."

      - uses: actions/upload-artifact@v7
        continue-on-error: ${{ inputs.ignore_artifact_upload_errors }}
        with:
          name: windows-x64-exe
          path: artifacts/windows-x64.exe

  windows-arm64:
    if: ${{ inputs.build_windows_arm64 }}
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7

      - name: Setup JetBrains Runtime (JBRSDK)
        shell: bash
        run: |
          set -e
          BASE="https://cache-redirector.jetbrains.com/intellij-jbr"
          FILE="jbrsdk-${JBR_VERSION}-windows-aarch64-${JBR_BUILD}.tar.gz"
          curl -fsSL "$BASE/$FILE" -o "$RUNNER_TEMP/jbr.tar.gz"
          mkdir -p "$RUNNER_TEMP/jbr"
          TARBALL="$(cygpath -u "$RUNNER_TEMP/jbr.tar.gz")"
          DEST="$(cygpath -u "$RUNNER_TEMP/jbr")"
          tar -xzf "$TARBALL" -C "$DEST" --strip-components=1
          echo "JAVA_HOME=$RUNNER_TEMP/jbr" >> $GITHUB_ENV
          echo "$RUNNER_TEMP/jbr/bin" >> $GITHUB_PATH
          java -version

      - uses: gradle/actions/setup-gradle@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}

      - name: Build EXE (arm64)
        shell: bash
        env:
          ELECTRON_BUILDER_7Z_FILTER: BCJ
        run: |
          set -e
          ./gradlew :${MODULE_PATH}:packageReleaseNsis
          mkdir -p artifacts
          EXE=$(find "${MODULE_PATH}/build/compose/binaries/main-release/nsis" -type f -name "*.exe" | head -n1)
          cp "$EXE" artifacts/windows-arm64.exe

      - name: Smoke test Windows app
        if: ${{ inputs.run_smoke_tests }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installer = Get-ChildItem -Path "artifacts" -Filter "*.exe" -File | Select-Object -First 1
          if (-not $installer) {
            throw "No Windows installer found."
          }

          $installDir = Join-Path $env:RUNNER_TEMP "smoke-install"
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null

          function Find-AppExecutable {
            param(
              [Parameter(Mandatory = $true)]
              [string] $Root
            )

            if (-not (Test-Path $Root)) {
              return $null
            }

            $candidates = Get-ChildItem -Path $Root -Recurse -Filter "*.exe" -File -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Name -notmatch "unins|uninstall|setup|installer|update|elevate|java|javaw|keytool|jpackage|jlink" -and
                $_.FullName -notmatch "\\resources\\|\\runtime\\|\\jre\\|\\jdk\\|\\bin\\"
              } |
              Sort-Object `
                @{ Expression = { if ($_.DirectoryName -eq $Root) { 0 } else { 1 } }; Ascending = $true },
                @{ Expression = { $_.DirectoryName.Split([IO.Path]::DirectorySeparatorChar).Count }; Ascending = $true },
                @{ Expression = { $_.Length }; Ascending = $false }

            $candidate = $candidates | Select-Object -First 1

            if ($candidate) {
              return $candidate.FullName
            }

            return $null
          }

          Write-Host "Installing $($installer.FullName) into $installDir"

          $installerProcess = Start-Process `
            -FilePath $installer.FullName `
            -ArgumentList @("/S", "/D=$installDir") `
            -Wait `
            -PassThru

          if ($installerProcess.ExitCode -ne 0) {
            throw "Installer exited with code $($installerProcess.ExitCode)."
          }

          $app = Find-AppExecutable -Root $installDir

          if (-not $app) {
            Write-Host "Installed files:"
            Get-ChildItem -Path $installDir -Recurse -ErrorAction SilentlyContinue |
              Select-Object FullName |
              Out-String -Width 240 |
              Write-Host

            throw "Installed app executable not found."
          }

          Write-Host "Launching $app"

          $process = Start-Process `
            -FilePath $app `
            -WorkingDirectory (Split-Path -Parent $app) `
            -PassThru

          Start-Sleep -Seconds 20

          $watchedProcess = Get-Process -Id $process.Id -ErrorAction SilentlyContinue
          if (-not $watchedProcess) {
            throw "App process exited during startup smoke test."
          }

          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          Write-Host "Smoke test passed. App stayed alive for 20 seconds."

      - uses: actions/upload-artifact@v7
        continue-on-error: ${{ inputs.ignore_artifact_upload_errors }}
        with:
          name: windows-arm64-exe
          path: artifacts/windows-arm64.exe

  macos-x64:
    if: ${{ inputs.build_macos_x64 }}
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v7

      - name: Setup JetBrains Runtime (JBRSDK)
        shell: bash
        run: |
          set -e
          BASE="https://cache-redirector.jetbrains.com/intellij-jbr"
          FILE="jbrsdk-${JBR_VERSION}-osx-x64-${JBR_BUILD}.tar.gz"
          curl -fsSL "$BASE/$FILE" -o "$RUNNER_TEMP/jbr.tar.gz"
          mkdir -p "$RUNNER_TEMP/jbr"
          tar -xzf "$RUNNER_TEMP/jbr.tar.gz" -C "$RUNNER_TEMP/jbr" --strip-components=1
          echo "JAVA_HOME=$RUNNER_TEMP/jbr/Contents/Home" >> $GITHUB_ENV
          echo "$RUNNER_TEMP/jbr/Contents/Home/bin" >> $GITHUB_PATH
          java -version

      - uses: gradle/actions/setup-gradle@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}

      - name: Build DMG (Apple Silicon)
        run: |
          set -e
          ./gradlew :${MODULE_PATH}:packageReleaseDmg
          mkdir -p artifacts
          DMG=$(find "${MODULE_PATH}/build" -type f -name "*.dmg" | head -n1)
          cp "$DMG" "artifacts/macos-x64.dmg"

      - name: Smoke test macOS app
        if: ${{ inputs.run_smoke_tests }}
        shell: bash
        run: |
          set -euo pipefail

          DMG="$(find artifacts -type f -name "*.dmg" | head -n1)"
          if [ -z "$DMG" ]; then
            echo "No DMG found."
            exit 1
          fi

          MOUNT="$RUNNER_TEMP/dmg"
          APP_ROOT="$RUNNER_TEMP/app"

          mkdir -p "$MOUNT" "$APP_ROOT"

          cleanup() {
            if [ -n "${PID:-}" ] && kill -0 "$PID" 2>/dev/null; then
              kill "$PID" || true
              wait "$PID" || true
            fi

            hdiutil detach "$MOUNT" -quiet || true
          }

          trap cleanup EXIT

          echo "Mounting $DMG"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT"

          APP_IN_DMG="$(find "$MOUNT" -maxdepth 3 -type d -name "*.app" | head -n1)"
          if [ -z "$APP_IN_DMG" ]; then
            echo "No .app bundle found in DMG."
            find "$MOUNT" -maxdepth 4 -print
            exit 1
          fi

          cp -R "$APP_IN_DMG" "$APP_ROOT/"
          APP="$APP_ROOT/$(basename "$APP_IN_DMG")"

          xattr -dr com.apple.quarantine "$APP" 2>/dev/null || true

          EXEC="$(find "$APP/Contents/MacOS" -maxdepth 1 -type f -perm -111 | head -n1)"
          if [ -z "$EXEC" ]; then
            EXEC="$(find "$APP/Contents/MacOS" -maxdepth 1 -type f | head -n1)"
          fi

          if [ -z "$EXEC" ]; then
            echo "No executable found in app bundle."
            find "$APP/Contents" -maxdepth 4 -print
            exit 1
          fi

          chmod +x "$EXEC"

          echo "Launching $EXEC"
          "$EXEC" &
          PID=$!

          sleep 20

          if kill -0 "$PID" 2>/dev/null; then
            echo "Smoke test passed. App stayed alive for 20 seconds."
          else
            set +e
            wait "$PID"
            CODE=$?
            set -e

            echo "App exited during startup smoke test with exit code $CODE."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        continue-on-error: ${{ inputs.ignore_artifact_upload_errors }}
        with:
          name: macos-x64-dmg
          path: artifacts/*.dmg

